[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dirty-git-finder"
version = "2.2.1"
description = "A GUI application that scans for Git repositories and shows which ones have uncommitted changes"
readme = "docs/README.md"
license = "MIT"
authors = [
    {name = "Julian", email = "dajuly20@github.com"}
]
keywords = ["git", "repository", "scanner", "gui", "tkinter", "dirty", "uncommitted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/dajuly20/scan-for-dirty-git-repos-gui"
Repository = "https://github.com/dajuly20/scan-for-dirty-git-repos-gui"
Issues = "https://github.com/dajuly20/scan-for-dirty-git-repos-gui/issues"

[project.scripts]
dirty-git-finder = "dirty_git_finder:main"
git-dirty = "git_dirty_cli:main"
dirty-git = "git_dirty_cli:main"

[project.gui-scripts]
dirty-git-finder-gui = "dirty_git_finder:main"

[tool.setuptools]
py-modules = ["dirty_git_finder", "git_dirty_cli", "git_scanner"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.png", "*.desktop"]
