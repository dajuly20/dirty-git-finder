name: Release - Build & Publish

on:
  push:
    tags:
      - 'v*'  # Matches v1.0.0, v2.1.0, etc.

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Verify package
        run: python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Installation

            ### Option 1: pipx (empfohlen)
            ```bash
            pipx install git+https://github.com/dajuly20/scan-for-dirty-git-repos-gui.git
            ```

            ### Option 2: pip
            ```bash
            pip install git+https://github.com/dajuly20/scan-for-dirty-git-repos-gui.git
            ```

            ### Option 3: Aus Release-Datei
            ```bash
            # Wheel herunterladen und installieren
            pip install dirty_git_finder-*-py3-none-any.whl
            ```

            ## Nutzung
            ```bash
            dirty-git-finder      # GUI starten
            git-dirty             # CLI
            git-dirty --gui       # CLI mit GUI-Flag
            dirty-git .           # Aktuelles Verzeichnis scannen
            ```
          draft: false
          prerelease: false

  # Optional: PyPI publish (nur wenn Trusted Publishing konfiguriert ist)
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dirty-git-finder
    permissions:
      id-token: write
    # Nur ausführen wenn das pypi environment existiert
    continue-on-error: true

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
