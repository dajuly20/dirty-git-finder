name: Release - Build & Upload

on:
  push:
    tags:
      - 'v*'  # Matches v1.0.0, v2.1.0, etc.

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          
      - name: Build package
        run: |
          python -m build
          
      - name: Verify package
        run: |
          python -m twine check dist/*
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          body: |
            # Release ${{ github.ref_name }}
            
            ## Installation
            
            ### From Wheel (Recommended - Fast!)
            ```bash
            pip install dirty_git_finder-*-py3-none-any.whl
            ```
            
            ### From Source Distribution
            ```bash
            pip install dirty_git_finder-*.tar.gz
            ```
            
            Then run:
            ```bash
            dirty-git-finder
            ```
            
            ## Changelog
            See commits: https://github.com/${{ github.repository }}/compare/$(git describe --tags --abbrev=0 HEAD^)...HEAD
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
